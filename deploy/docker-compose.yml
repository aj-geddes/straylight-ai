services:
  straylight:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "9470:9470"
    volumes:
      - straylight-data:/data
    restart: unless-stopped
    # Security hardening (WP-2.6):
    # read_only filesystem prevents persistent writes outside of mounted volumes.
    # /tmp is mounted as a tmpfs to allow scratch space without disk writes.
    read_only: true
    tmpfs:
      - /tmp:size=10M
    # cap_drop ALL removes all Linux capabilities; add back only what is needed.
    # Straylight runs on port 9470 (>1024) so no CAP_NET_BIND_SERVICE is required.
    cap_drop:
      - ALL
    # CAP_SETUID and CAP_SETGID are re-added specifically to allow the main
    # process (uid 10001) to drop exec child processes to uid 10101
    # ("straylight-exec") via SysProcAttr.Credential. This is the structural
    # control (ADR-013 Part A, Option A2) that makes /data/openbao/init.json
    # unreadable by exec children: the kernel returns EACCES on open(2) for
    # all binaries running as uid 10101 against a 0600 file owned by 10001.
    # Net posture: stronger than cap_drop ALL alone, because without this the
    # exec child would run as the vault-owning uid and could read init.json.
    cap_add:
      - SETUID
      - SETGID

volumes:
  straylight-data:
